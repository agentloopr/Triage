# Secret-scanning rules, on top of gitleaks' defaults.
#
# The extras below exist because a green scan is only as good as its rule set, and the default set
# does not know every token format a project touches. An audit of the system this was extracted from
# found a live credential sitting in a tracked file that gitleaks had never had a rule for — the scan
# had been passing for months and proving nothing.
#
# Add a rule here whenever this repo starts handling a new provider's tokens.
#
# ⚠️ Testing a rule: use a RANDOM-looking value, never `pk_123456789_ABCDEF…`. Gitleaks' default
# allowlist filters obvious placeholder values, so an obviously-fake token produces "no leaks found"
# and reads exactly like a broken rule. That same behaviour is why `.env.example` does not trip it.

[extend]
useDefault = true

[[rules]]
id = "clickup-api-token"
description = "ClickUp personal API token"
# ClickUp tokens are `pk_` followed by a numeric user id and an alphanumeric secret. There is no
# default rule for this format anywhere in gitleaks.
regex = '''pk_[0-9]{6,}_[A-Z0-9]{20,}'''
keywords = ["pk_"]

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek API key"
regex = '''sk-[a-f0-9]{32}'''
keywords = ["sk-"]

[[rules]]
id = "linear-api-key"
description = "Linear API key"
regex = '''lin_api_[A-Za-z0-9]{32,}'''
keywords = ["lin_api_"]

[allowlist]
description = "Synthetic values that exist to prove redaction works"
# Allowlisted by VALUE, never by path. Exempting a whole file means a real credential committed to
# that file later is invisible, and the two files previously exempted here — `tier2Prefetch.test.ts`
# and `.env.example` — turned out to trip no rule at all. The exemptions bought nothing and cost a
# permanent blind spot in the one gate that has to be airtight before publishing.
#
# Each literal below is a fixture asserting that redaction works. If a scan ever fails on one, check
# the value is still synthetic — do not put its file back in a path list.
regexes = [
  '''xoxb-1234567890-abcdefghijkl''',                    # tier2Prefetch.test.ts — scrubbed from a card comment
  '''pk_12345678_ABCDEFGHIJKLMNOPQRSTUVWXYZ012345''',    # otel.test.ts — scrubbed from a span attribute
]
