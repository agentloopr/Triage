name: CI
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit        # tests INCLUDED
      - run: npm run lint
      - run: npm test
      # No secrets in this job's env — that is the point. This step passing in public is what proves
      # the "runs with no API key" claim, rather than the README asserting it.
      - run: npm run demo -- --twice
      # The second provider's recording, replayed offline. It does not gate — the goldens describe
      # the DeepSeek run and the two models disagree about what counts as an action item — but it
      # must still REPLAY, or the committed cassettes quietly rot behind a doc that cites them.
      - run: npm run demo -- --provider anthropic
      # The agent layer, replayed offline on both providers. It is off by default in normal use, so
      # without these steps its recordings rot exactly like the Anthropic set nearly did — and the
      # read-only guarantee would be asserted only by unit tests, never by a whole run.
      - run: npm run demo -- --agents
      - run: npm run demo -- --agents --provider anthropic
      # Never --labels here: that path calls a judge model, and this job has no secrets.
      - run: npm run eval

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the scan must cover every commit, not just the tip

      # The gitleaks BINARY, not gitleaks-action: the action requires a paid licence key for
      # organization-owned repositories, which would make this gate depend on a subscription rather
      # than on the code. The binary is the same scanner with no such condition.
      - name: gitleaks (full history)
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks --version
          # `git` scans every commit; `dir` scans the working tree. `detect` is a deprecated alias
          # whose --no-git flag silently does nothing on 8.28 — do not reintroduce it.
          ./gitleaks git . --config .gitleaks.toml --redact --exit-code 1
          ./gitleaks dir . --config .gitleaks.toml --redact --exit-code 1

      - name: no internal debug routes
        run: '! grep -rn "debug/clarify-test" --include="*.ts" --include="*.md" . || exit 1'

      # gitleaks finds credentials. This finds IDENTIFIERS — internal product, person and tracker ids,
      # which leak where the code came from without being secret. gitleaks has no rule for any of them,
      # and that is not an oversight in gitleaks: a task id authenticates nothing. It is how a real
      # ClickUp id survived four commits inside a worked example, wearing a fixture-shaped prefix.
      #
      # THE PATTERNS ARE NOT IN THIS FILE. They used to be, and that was self-defeating: a guard whose
      # job is keeping internal names out of a public repo cannot list those names in a file the repo
      # publishes. They live in the IDENTIFIER_PATTERNS repository variable, one extended-regex per
      # line, and the step below fails loudly if it is unset — an empty pattern list would otherwise
      # scan for nothing and pass, which is the exact "configured but doing nothing" failure this
      # repo documents.
      #
      # Set it with:  gh variable set IDENTIFIER_PATTERNS --repo <owner>/<repo> --body "$(cat patterns.txt)"
      - name: no internal identifiers
        env:
          IDENTIFIER_PATTERNS: ${{ vars.IDENTIFIER_PATTERNS }}
        run: |
          set -u
          if [ -z "${IDENTIFIER_PATTERNS// /}" ]; then
            echo "::error::IDENTIFIER_PATTERNS repository variable is unset — the identifier guard would scan for nothing and pass"
            exit 1
          fi
          fail=0
          # FILE CONTENT ONLY, deliberately — not git history. Commit authorship is attribution and
          # is meant to be public; --exclude-dir=.git is a decision, not an oversight. Do not read a
          # green run here as "the history was scrubbed", because it was not.
          while IFS= read -r pattern; do
            [ -z "${pattern// /}" ] && continue
            if grep -rniE --exclude-dir=node_modules --exclude-dir=.git \
                 --include='*.ts' --include='*.md' --include='*.json' --include='*.txt' "$pattern" .; then
              echo "::error::an internal identifier matched — see the matches above"
              fail=1
            fi
          done <<< "$IDENTIFIER_PATTERNS"
          exit $fail
