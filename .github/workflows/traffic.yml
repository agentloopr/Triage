name: traffic export

# GitHub Insights → Traffic retains 14 days. This is not a schedule for convenience — it's the
# only way to keep more than a fortnight of the launch, which is the window that matters most.
#
# Uses a PAT (TRAFFIC_TOKEN), not the default GITHUB_TOKEN: the traffic API requires push access,
# and the automatic token's standing to satisfy that check is not something this workflow should
# gamble on silently. Set it once:
#   gh secret set TRAFFIC_TOKEN --repo agentloopr/ops-agent-reference --body "<a PAT with repo scope>"
#
# If the secret is unset, this fails loudly rather than logging nothing — the same rule the
# IDENTIFIER_PATTERNS guard in ci.yml follows, for the same reason: a workflow that is configured
# to do nothing and reports success is worse than one that never ran.

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday — arbitrary time chosen to avoid the top-of-hour crowd
  workflow_dispatch: {}

permissions:
  contents: write

# Two exporters writing the same branch would race on the push. Weekly + manual dispatch makes that
# unlikely rather than impossible, and "unlikely" is how the cross-process lock bug in this repo's
# own history started.
concurrency:
  group: traffic-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: require TRAFFIC_TOKEN
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "${TRAFFIC_TOKEN}" ]; then
            echo "::error::TRAFFIC_TOKEN is unset — this run would silently export nothing. See the comment at the top of this file."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: metrics
          fetch-depth: 0

      # **Referrers and paths are collected but NOT published.**
      #
      # `traffic/popular/referrers` is privileged data — GitHub shows it only to people with push
      # access — and this branch is public. Today's referrers are benign (github.com, google). A
      # future one can be an internal hostname, an unreleased campaign URL, a partner system, or a
      # private Slack/Notion workspace that linked here. Publishing raw referrers turns a weekly
      # analytics job into a standing disclosure channel for whatever happens to appear in it later.
      #
      # So the export keeps the aggregate — how many referrers, how much traffic — and drops the
      # names. Counts are what the launch actually needs measured; the names are readable any time
      # in the Insights tab by anyone entitled to see them.
      #
      # `${{ github.repository }}` is passed through `env` rather than interpolated into the shell
      # body: expression interpolation splices text directly into the script, so a value containing
      # shell syntax would execute. It cannot here — GitHub controls that particular value — but
      # "this specific one is safe" is the reasoning that makes the habit unsafe everywhere else.
      - name: fetch traffic snapshot
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          mkdir -p traffic
          gh api "repos/${REPO}/traffic/views" > "traffic/views-${STAMP}.json"
          gh api "repos/${REPO}/traffic/clones" > "traffic/clones-${STAMP}.json"
          gh api "repos/${REPO}" --jq '{stars: .stargazers_count, watchers: .subscribers_count, forks: .forks_count, at: now | strftime("%Y-%m-%dT%H:%M:%SZ")}' > "traffic/stars-${STAMP}.json"

          # Aggregate only — count of distinct referrers and their total, never the referrer names.
          gh api "repos/${REPO}/traffic/popular/referrers" \
            --jq '{distinct_referrers: length, total_count: (map(.count) | add // 0), total_uniques: (map(.uniques) | add // 0)}' \
            > "traffic/referrers-summary-${STAMP}.json"
          gh api "repos/${REPO}/traffic/popular/paths" \
            --jq '{distinct_paths: length, total_count: (map(.count) | add // 0), total_uniques: (map(.uniques) | add // 0)}' \
            > "traffic/paths-summary-${STAMP}.json"

      # The bot's commits land on `metrics`, which CI does not scan — ci.yml runs on `main` and pull
      # requests only. Rather than widen CI to a branch it has no reason to build, the export refuses
      # to commit anything that is not one of the shapes it just produced.
      - name: refuse to publish anything unexpected
        run: |
          set -euo pipefail
          for f in traffic/*.json; do
            case "$(basename "$f")" in
              views-*.json|clones-*.json|stars-*.json|referrers-summary-*.json|paths-summary-*.json) ;;
              *) echo "::error::unexpected file staged for the public metrics branch: $f"; exit 1 ;;
            esac
          done
          # Belt and braces: no raw referrer/path names may appear in any file about to be pushed.
          if grep -rlE '"referrer"|"path"[[:space:]]*:' traffic/ 2>/dev/null | grep -q .; then
            echo "::error::a raw referrer/path name reached the public export — see SEC-05"
            exit 1
          fi

      - name: verify the snapshot is non-empty
        run: |
          set -euo pipefail
          for f in traffic/views-*.json traffic/clones-*.json; do
            latest="$(ls -t $f | head -1)"
            # A well-formed empty response still has a "count" key at 0 — this only catches an
            # actually broken/empty file, which is the "configured but doing nothing" failure.
            python3 -c "import json,sys; d=json.load(open('$latest')); assert 'count' in d, 'malformed traffic response'" || {
              echo "::error::$latest did not contain a usable traffic snapshot"; exit 1;
            }
          done

      - name: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/
          if git diff --cached --quiet; then
            echo "no new traffic files"
          else
            git commit -m "traffic: $(date -u +%Y-%m-%d) snapshot"
            git push origin metrics
          fi
